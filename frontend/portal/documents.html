<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Client portal — documents associated with your matter.">
    <meta name="robots" content="noindex,nofollow">
    <title>Documents | Client Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body class="phase5-page documents-page">
    <div class="portal">
        <div data-portal-topbar></div>
        <main class="portal-main">
            <div data-portal-sidebar></div>
            <div class="portal-content">

                <div class="page-head">
                    <div>
                        <span class="kicker">Documents</span>
                        <h1>Documents.</h1>
                        <p class="head-meta">Documents associated with your matter. Files are stored securely and accessed through authenticated endpoints.</p>
                    </div>
                    <div class="action-row">
                        <button class="btn primary" id="btn-upload-document">Upload Document</button>
                    </div>
                </div>

                <div id="docs-requests"></div>

                <section class="panel" aria-labelledby="docs-head">
                    <div class="panel-head">
                        <h2 id="docs-head">Your documents</h2>
                        <span class="panel-meta" id="docs-meta">Loading…</span>
                    </div>
                    <div class="panel-body tight">
                        <div id="docs-root">
                            <div class="empty-state"><strong>Loading…</strong></div>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="../js/site.js"></script>
    <script src="../js/realtime.js"></script>
    <script src="../js/doc-viewer.js"></script>
    <script src="portal.js"></script>
    <script src="documents.js"></script>
</body>
</html>
