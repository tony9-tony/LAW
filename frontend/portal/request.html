<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Request details | Client Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="portal">
        <div data-portal-topbar></div>
        <main class="portal-main">
            <div data-portal-sidebar></div>
            <div class="portal-content">

                <div class="page-head">
                    <div>
                        <a class="link-muted" href="requests.html">â† All requests</a>
                        <span class="kicker spacer-1" id="ref">Reference</span>
                        <h1 id="subject">Request details.</h1>
                        <p class="head-meta" id="head-meta">Loadingâ€¦</p>
                    </div>
                    <div class="page-actions" id="page-actions">
                        <span class="text-tiny-mute">Loadingâ€¦</span>
                    </div>
                </div>

                 <div id="root">
                     <p class="text-mute-block">Loading requestâ€¦</p>
                 </div>

                 <div id="message-section" style="display:none;">
                     <section class="panel">
                         <div class="panel-head">
                             <h2>Message the lawyer</h2>
                             <span class="panel-meta" id="msg-meta">Loadingâ€¦</span>
                         </div>
                         <div class="panel-body">
                             <div class="thread" id="msg-thread"></div>
                             <div class="compose">
                                 <div class="alert info" id="msg-notice">
                                     <strong>Secure messaging.</strong>
                                     Messages are stored against your request and are visible to the firm only.
                                 </div>
                                 <form id="msg-form">
                                     <div class="field">
                                         <label for="msg-body">Write your message here...</label>
                                         <textarea id="msg-body" name="body" placeholder="Write your message here..." required></textarea>
                                     </div>
                                     <div class="form-status" id="msg-status" role="status" aria-live="polite"></div>
                                     <div class="page-actions">
                                         <button type="submit" class="btn primary">Send Message <span class="arrow" aria-hidden="true">â†’</span></button>
                                     </div>
                                 </form>
                             </div>
                         </div>
                     </section>
                 </div>

             </div>
        </main>
    </div>

    <script src="../js/site.js"></script>
    <script src="../js/realtime.js"></script>
    <script src="portal.js"></script>
    <script src="request.js"></script>
</body>
</html>
