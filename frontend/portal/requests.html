<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Client portal — your requests.">
    <meta name="robots" content="noindex,nofollow">
    <title>Requests | Client Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="portal">
        <div data-portal-topbar></div>
        <main class="portal-main">
            <div data-portal-sidebar></div>
            <div class="portal-content">

                <div class="page-head">
                    <div>
                        <span class="kicker">Requests</span>
                        <h1>My requests.</h1>
                        <p class="head-meta">All matters and consultations you have submitted through the portal. Click a row to view details and the timeline.</p>
                    </div>
                    <div class="page-actions">
                        <a class="btn" href="custom-matter.html">New matter <span class="arrow" aria-hidden="true">→</span></a>
                        <a class="btn secondary" href="consultation.html">Book consultation</a>
                    </div>
                </div>

                <section class="panel" aria-labelledby="all-head">
                    <div class="panel-head">
                        <h2 id="all-head">All requests</h2>
                        <span class="panel-meta" id="count-meta">Loading…</span>
                    </div>
                    <div class="panel-body tight">
                        <table class="requests-table">
                            <thead>
                                <tr>
                                    <th class="col-ref">Reference</th>
                                    <th>Subject</th>
                                    <th class="col-status-140">Status</th>
                                    <th class="col-date-140">Submitted</th>
                                    <th class="col-date-140">Last update</th>
                                </tr>
                            </thead>
                            <tbody id="all-body">
                                <tr><td colspan="5" class="empty-state"><span class="ico">·</span><strong>Loading your requests…</strong></td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="../js/site.js"></script>
    <script src="portal.js"></script>
    <script src="requests.js"></script>
</body>
</html>
