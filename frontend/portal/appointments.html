<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Client portal — your scheduled appointments.">
    <meta name="robots" content="noindex,nofollow">
    <title>Appointments | Client Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="portal">
        <div data-portal-topbar></div>
        <main class="portal-main">
            <div data-portal-sidebar></div>
            <div class="portal-content">

                <div class="page-head">
                    <div>
                        <span class="kicker">Calendar</span>
                        <h1>Appointments.</h1>
                        <p class="head-meta">Upcoming and past appointments scheduled by the firm across all your matters.</p>
                    </div>
                </div>

                <section class="panel" aria-labelledby="appts-head">
                    <div class="panel-head">
                        <h2 id="appts-head">Upcoming</h2>
                        <span class="panel-meta" id="upcoming-meta">Loading…</span>
                    </div>
                    <div class="panel-body tight">
                        <div id="upcoming-root">
                            <div class="empty-state"><span class="ico">·</span><strong>Loading…</strong></div>
                        </div>
                    </div>
                </section>

                <section class="panel" aria-labelledby="past-head">
                    <div class="panel-head">
                        <h2 id="past-head">Past appointments</h2>
                        <span class="panel-meta" id="past-meta">Loading…</span>
                    </div>
                    <div class="panel-body tight">
                        <div id="past-root">
                            <div class="empty-state"><span class="ico">·</span><strong>Loading…</strong></div>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>
    <script src="../js/site.js"></script>
    <script src="portal.js"></script>
    <script src="appointments.js"></script>
</body>
</html>
