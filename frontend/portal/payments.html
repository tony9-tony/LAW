<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Payments | Client Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body class="phase5-page payments-page">
    <div class="portal">
        <div data-portal-topbar></div>
        <main class="portal-main">
            <div data-portal-sidebar></div>
            <div class="portal-content">

                <div class="page-head">
                    <div>
                        <span class="kicker">Billing</span>
                        <h1>Payments.</h1>
                        <p class="head-meta">Your payment history and submissions.</p>
                    </div>
                </div>

                <section class="panel" aria-labelledby="pay-head">
                    <div class="panel-head">
                        <h2 id="pay-head">My Payments</h2>
                        <span class="panel-meta" id="payments-meta">Loading…</span>
                    </div>
                    <div class="panel-body tight">
                        <div id="payments-root">
                            <div class="empty-state"><strong>Loading payments…</strong></div>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="../js/site.js"></script>
    <script src="../js/realtime.js"></script>
    <script src="../js/doc-viewer.js"></script>
    <script src="portal.js"></script>
    <script src="payments.js"></script>
</body>
</html>
