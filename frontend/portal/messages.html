<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Messages | Client Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body class="phase4-page messages-page">
    <div class="portal">
        <div data-portal-topbar></div>
        <main class="portal-main">
            <div data-portal-sidebar></div>
            <div class="portal-content">
                <div class="page-head">
                    <div>
                        <span class="kicker">Client workspace</span>
                        <h1>Messages</h1>
                    </div>
                    <div class="page-actions" id="msg-actions">
                        <a class="btn secondary" href="requests.html">Back to requests</a>
                    </div>
                </div>

                <div id="messages-root">
                    <div id="messages-inbox">
                        <section class="panel" aria-labelledby="inbox-head">
                            <div class="panel-head">
                                <h2 id="inbox-head">Conversations</h2>
                                <span class="panel-meta" id="inbox-meta">Loading...</span>
                            </div>
                            <div class="panel-body tight">
                                <div id="inbox-list"></div>
                            </div>
                        </section>
                    </div>
                    <div id="messages-thread" style="display:none;">
                        <section class="panel" aria-labelledby="thread-head">
                            <div class="panel-head">
                                <h2 id="thread-head">Conversation</h2>
                                <span class="panel-meta" id="thread-meta">Loading...</span>
                            </div>
                            <div class="panel-body">
                                <div id="thread-context" class="alert info"></div>
                                <div id="chat-root"></div>
                                <div class="alert info" id="compose-notice" style="display:none"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/site.js"></script>
    <script src="../js/realtime.js"></script>
    <script src="../js/chat-widget.js"></script>
    <script src="portal.js"></script>
    <script src="messages.js"></script>
</body>
</html>
