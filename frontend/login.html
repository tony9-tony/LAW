<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to the client portal.">
    <title>Client Login | Emmanuel Richard Machibya</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="site-shell">
        <div data-site-header></div>

        <main class="site-main">
            <section class="form-shell">
                <div class="wrap wrap-tight">
                    <div class="section-title mb-4">
                        <span class="kicker">Client portal</span>
                        <h1>Sign in.</h1>
                        <p class="text-muted">Access your requests, matters, and secure conversations with the firm.</p>
                    </div>

                    <form id="loginForm" class="form form-panel form-panel--narrow" novalidate>
                        <div class="field">
                            <label for="li-email">Email address</label>
                            <input id="li-email" name="email" type="email" autocomplete="email" required>
                            <span class="error">Please provide a valid email.</span>
                        </div>
                        <div class="field">
                            <label for="li-password">Password</label>
                            <input id="li-password" name="password" type="password" autocomplete="current-password" minlength="12" required>
                            <span class="help">At least 12 characters.</span>
                            <span class="error">Password is required.</span>
                        </div>

                        <div class="form-status" id="li-status" role="status" aria-live="polite"></div>

                        <div class="actions">
                            <button type="submit" class="button">Sign in <span class="arrow" aria-hidden="true">→</span></button>
                            <a class="button ghost-dark" href="register.html">Create an account</a>
                            <a class="button ghost-dark" href="/">← Back to website</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <div data-site-footer></div>
    </div>
    <script src="js/site.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
