<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a client account.">
    <title>Create Account | Emmanuel Richard Machibya</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="site-shell">
        <div data-site-header></div>

        <main class="site-main">
            <section class="form-shell">
                <div class="wrap wrap-tight">
                    <div class="section-title mb-4">
                        <span class="kicker">Client portal</span>
                        <h1>Create an account.</h1>
                        <p class="text-muted">An account lets you submit matters, see status, and exchange secure messages with the firm.</p>
                    </div>

                    <form id="registerForm" class="form form-panel form-panel--narrow" novalidate>
                        <div class="field">
                            <label for="rg-name">Full name</label>
                            <input id="rg-name" name="fullName" type="text" autocomplete="name" minlength="2" maxlength="160" required>
                            <span class="error">Please provide your full name.</span>
                        </div>
                        <div class="field">
                            <label for="rg-email">Email address</label>
                            <input id="rg-email" name="email" type="email" autocomplete="email" required>
                            <span class="error">Please provide a valid email.</span>
                        </div>
                        <div class="field">
                            <label for="rg-password">Password</label>
                            <input id="rg-password" name="password" type="password" autocomplete="new-password" minlength="12" required>
                            <span class="help">At least 12 characters.</span>
                            <span class="error">Password must be at least 12 characters.</span>
                        </div>

                        <div class="form-status" id="rg-status" role="status" aria-live="polite"></div>

                        <div class="actions">
                            <button type="submit" class="button">Create account <span class="arrow" aria-hidden="true">→</span></button>
                            <a class="button ghost-dark" href="login.html">I already have an account</a>
                            <a class="button ghost-dark" href="/">← Back to website</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <div data-site-footer></div>
    </div>
    <script src="js/site.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>
</html>
